<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロードンデン — 商店街の向こうへ</title><!-- STYLE --></head>
<body>
<header><div class="brand"><span class="seal" aria-hidden="true">R</span><div><h1>ロードンデン</h1><p>商店街から脇道へ。窓の向こうに、誰かの暮らし。</p></div></div><div class="clock"><span id="day">第一日</span><strong id="time">16:00</strong><small id="running">街は動いています</small></div><nav aria-label="手元の道具"><button id="map">地図 <kbd>M</kbd></button><button id="inventory">持ち物 <kbd>I</kbd></button><button id="notebook">手帳 <kbd>J</kbd></button><button id="save-menu">保存・設定</button></nav></header>
<main>
<section class="world" aria-label="街の全体マップ"><div class="world-caption"><span>街の全体マップ</span><p id="location-level">アパート A棟 / 1階</p><button id="help" aria-label="操作方法">?</button></div><div id="districts" aria-label="地図で見る区間"></div><canvas id="town" width="1300" height="900" tabindex="0" aria-label="商店街と住宅街の全体マップ。ドラッグで表示を動かし、ホイールで拡縮。部屋や通路をクリックして歩きます"></canvas><div class="map-key"><span><i></i> あなた</span><span>ドラッグ：地図移動</span><div class="zoom"><button id="zoom-out" aria-label="縮小">−</button><button id="zoom-reset">全体</button><button id="follow">あなたへ</button><button id="zoom-in" aria-label="拡大">＋</button></div><button id="pause">一時停止 <kbd>Esc</kbd></button></div><div class="mini-wrap"><canvas id="minimap" width="750" height="240" aria-label="街全体の小地図。クリックした区間を見る"></canvas><span>西口 ← 商店街 → 東口　小地図を選んで表示を移動</span></div></section>
<aside class="place-panel"><p class="eyebrow">いま、ここに</p><h2 id="place-name">A棟 101・管理人室</h2><p id="place-description"></p><div id="activity" role="status"></div><div class="rule"></div><h3>声をかける</h3><div id="people" class="stack"></div><h3>あたりを見る</h3><div id="nearby" class="stack"></div><div id="observations"></div><h3>ここから歩く</h3><div id="exits" class="exits"></div><button id="wait" class="wait">少し待つ</button><button id="cancel" class="subtle" hidden>いまの行動を中断</button><p class="tip">手帳には、自分で見聞きしたことが残ります。</p></aside>
</main>
<footer><span>通りを一本曲がれば、また別の暮らし。</span><span>矢印 / WASD：歩く　E：話す　I：持ち物　J：手帳</span></footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal" aria-labelledby="modal-title"><button id="close-modal" aria-label="閉じる">×</button><p class="eyebrow" id="modal-kicker">ロードンデン</p><h2 id="modal-title"></h2><div id="modal-body"></div></dialog>
<!-- SCRIPT -->
</body></html>
