<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ロードンデン — 棟と棟のあいだ</title><style>:root{color-scheme:light;--paper:#f6f1e5;--ink:#303f3a;--muted:#6e776a;--green:#526e55;--line:#d7d7c5;--accent:#a95b3f;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;font-size:14px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:#fffdf6;border-radius:6px;padding:10px 13px;transition:background .15s}button:hover{background:#e9eddc}button:focus-visible,canvas:focus-visible{outline:3px solid #ba744d;outline-offset:3px}button:disabled{opacity:.48;cursor:default}h1,h2{font-family:'Yu Mincho','Hiragino Mincho ProN',serif;font-weight:500}header{max-width:1530px;margin:auto;display:flex;align-items:center;gap:28px;padding:24px 36px 22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:15px;flex:1}.seal{border:1px solid #778b6d;color:var(--green);font-family:Georgia,serif;font-size:28px;width:43px;height:50px;border-radius:22px 22px 6px 6px;display:grid;place-items:center}h1{font-size:27px;letter-spacing:.14em;margin:0 0 7px}.brand p{margin:0;color:var(--muted);font-size:11px;letter-spacing:.06em}.clock{display:grid;grid-template-columns:auto auto;gap:1px 10px;align-items:center}.clock span{font-size:11px}.clock strong{font-family:Georgia,serif;font-weight:400;font-size:26px}.clock small{grid-column:1 / 3;font-size:10px;color:var(--muted);text-align:right}nav{display:flex;gap:8px}nav button{font-size:12px}kbd{font:10px ui-monospace,monospace;border:1px solid var(--line);border-radius:3px;padding:1px 4px;color:var(--muted);margin-left:8px}main{max-width:1530px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 310px;padding:24px 36px;gap:28px}.world{position:relative;background:#e0e5cc;border:1px solid #c8cfb7;border-radius:12px;overflow:hidden;align-self:start;box-shadow:0 4px 24px #3d4e3710}.world-caption{position:absolute;top:18px;left:22px;right:18px;display:flex;align-items:center;gap:15px;z-index:1;pointer-events:none}.world-caption span{border:1px solid #748266;border-radius:2px;padding:3px 9px;font-size:11px;letter-spacing:.1em;background:#f6f1e599}.world-caption p{font-family:'Yu Mincho',serif;font-size:13px}.world-caption button{margin-left:auto;padding:4px 10px;border-radius:50%;pointer-events:auto;background:#f6f1e5ba}canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 240px);min-height:430px;object-fit:contain;touch-action:manipulation}.map-key{display:flex;align-items:center;gap:18px;border-top:1px solid #c8cfb7;background:#eef0df;font-size:11px;padding:10px 16px;color:var(--muted)}.map-key i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#a95b3f;margin-right:5px}.map-key button{margin-left:auto;background:transparent;font-size:11px;padding:5px 8px}.place-panel{padding:8px 0 0}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin:0 0 12px}h2{font-size:25px;letter-spacing:.05em;margin:0 0 16px}#place-description{font-size:13px;line-height:1.9;color:var(--muted);min-height:50px}#activity{min-height:28px;color:var(--accent);font-size:12px;line-height:1.8}.rule{height:1px;background:var(--line);margin:14px 0 20px}h3{font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--muted);margin:20px 0 9px}.stack{display:grid;gap:7px}.stack button{text-align:left;font-size:12px;line-height:1.5}.person{display:flex;align-items:center;gap:9px}.person i{height:10px;width:10px;border-radius:50%;background:var(--green)}.person small{margin-left:auto;color:var(--muted)}.empty{font-size:12px;color:var(--muted);margin:6px 0;line-height:1.8}.exits{display:flex;flex-wrap:wrap;gap:6px}.exits button{font-size:11px;padding:7px 9px;background:transparent}.wait{width:100%;margin-top:24px;background:#526e55;color:#fffdf6;border-color:#526e55}.wait:hover{background:#445d47}.subtle{width:100%;font-size:11px;border:0;background:transparent;color:var(--muted);padding:8px}.tip{font-size:10px;line-height:1.9;color:var(--muted);margin-top:18px}footer{max-width:1530px;margin:auto;padding:0 36px 20px;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:10px}dialog{width:min(580px,calc(100vw - 32px));max-height:85vh;overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:32px;box-shadow:0 20px 80px #17231c33}dialog::backdrop{background:#22362e65;backdrop-filter:blur(3px)}#close-modal{position:absolute;right:16px;top:12px;background:transparent;border:0;font-size:23px;padding:4px 9px}#modal-body p{line-height:1.9;font-size:13px}#modal-body .stack{margin-top:24px}.journal-entry{padding:14px 0;border-bottom:1px solid var(--line)}.journal-entry small{font-size:10px;color:var(--muted)}.journal-entry p{margin:4px 0}.confirmed{color:var(--accent)}.save-row{display:flex;gap:8px;align-items:center;margin:8px 0}.save-row span{margin-right:auto;font-size:12px}.save-row button{font-size:12px}.file-label{display:block;border:1px dashed #a1ab94;border-radius:6px;padding:14px;margin-top:10px;font-size:12px}.file-label input{display:block;margin-top:9px;width:100%;font:inherit}#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);max-width:min(600px,90vw);padding:12px 20px;background:#30493f;color:#fefbf0;border-radius:7px;font-size:12px;line-height:1.7;box-shadow:0 5px 20px #132a2030;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}#toast.show{opacity:1}#toast.error{background:#904b3b}.welcome-note{padding:14px;background:#e7ebd9;border-radius:6px}.primary{background:var(--green);color:white}.primary:hover{background:#435d46}[hidden]{display:none!important}@media(min-width:1600px){canvas{max-height:850px}}@media(max-width:1000px){header{padding:18px 20px;gap:18px}main{padding:18px 20px;grid-template-columns:minmax(0,1fr) 270px;gap:20px}nav{gap:5px}nav button{padding:8px}kbd{display:none}.brand p{font-size:10px}h1{font-size:23px}.seal{display:none}.map-key{gap:9px}.map-key span:nth-child(2){display:none}footer{padding:0 20px 16px}}@media(max-width:720px){header{flex-wrap:wrap;gap:14px}nav{width:100%;display:flex}nav button{flex:1}main{display:block;padding:12px}canvas{min-height:0;max-height:65vh}.world-caption{top:8px;left:12px;right:10px;gap:8px}.world-caption p{font-size:11px}.world-caption span{font-size:9px}.place-panel{padding:24px 8px}.place-panel h2{font-size:24px}.stack button{padding:12px}footer{padding:0 20px 20px;display:block}footer span{display:block;margin-top:6px}.world-caption button{font-size:12px}dialog{padding:26px 22px}.clock strong{font-size:24px}}

:root{--paper:#f4f0e6;--ink:#304647;--muted:#6c7975;--green:#597b75;--line:#d0d7ce;--accent:#a96043}h1{letter-spacing:.08em}.seal{border-radius:3px}.world{background:#e9e8db;border-color:#c6cec5}.world-caption{position:static;padding:13px 18px;background:#e5e8dd;border-bottom:1px solid #c6cec5}.world-caption p{margin:0;font-family:inherit;font-size:11px}.world-caption span{background:#f4f0e6}.map-key{background:#e5e8dd;gap:12px}.map-key .zoom{display:flex;gap:3px;margin-left:auto}.map-key .zoom button{margin:0;min-width:28px}canvas{min-height:0;max-height:none;aspect-ratio:13 / 9}.place-panel h2{font-size:22px;line-height:1.5}.wait{background:var(--green);border-color:var(--green)}.primary{background:var(--green)}.welcome-note{background:#e4e9dc}a{color:#426e69}.exits button:disabled{opacity:.45}@media(max-width:720px){.world-caption{padding:10px;gap:8px}.world-caption p{font-size:10px}canvas{max-height:none}.map-key{gap:8px;padding:8px 10px}.map-key .zoom{margin-left:auto}.place-panel{padding-top:20px}.world-caption span{white-space:nowrap}}

<body>
<header><div class="brand"><span class="seal" aria-hidden="true">R</span><div><h1>ロードンデン</h1><p>共用廊下の向こうに、誰かの暮らし。</p></div></div><div class="clock"><span id="day">第一日</span><strong id="time">16:00</strong><small id="running">街は動いています</small></div><nav aria-label="手元の道具"><button id="map">地図 <kbd>M</kbd></button><button id="inventory">持ち物 <kbd>I</kbd></button><button id="notebook">手帳 <kbd>J</kbd></button><button id="save-menu">保存・設定</button></nav></header>
<main>
<section class="world" aria-label="棟と棟のあいだ"><div class="world-caption"><span>集合住宅編</span><p id="location-level">アパート A棟 / 1階</p><button id="help" aria-label="操作方法">?</button></div><canvas id="town" width="1300" height="900" tabindex="0" aria-label="雑居ビルとアパート二棟の断面図。部屋、共用廊下、階段をクリックして移動します"></canvas><div class="map-key"><span><i></i> あなた</span><span>部屋・階段を選んで歩く</span><div class="zoom"><button id="zoom-out" aria-label="縮小">−</button><button id="zoom-reset">全体</button><button id="zoom-in" aria-label="拡大">＋</button></div><button id="pause">一時停止 <kbd>Esc</kbd></button></div></section>
<aside class="place-panel"><p class="eyebrow">いま、ここに</p><h2 id="place-name">A棟 101・管理人室</h2><p id="place-description"></p><div id="activity" role="status"></div><div class="rule"></div><h3>声をかける</h3><div id="people" class="stack"></div><h3>あたりを見る</h3><div id="nearby" class="stack"></div><div id="observations"></div><h3>ここから歩く</h3><div id="exits" class="exits"></div><button id="wait" class="wait">少し待つ</button><button id="cancel" class="subtle" hidden>いまの行動を中断</button><p class="tip">手帳には、自分で見聞きしたことが残ります。</p></aside>
</main>
<footer><span>中庭を挟んで、今日も暮らしは続く。</span><span>矢印 / WASD：歩く　E：話す　I：持ち物　J：手帳</span></footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal" aria-labelledby="modal-title"><button id="close-modal" aria-label="閉じる">×</button><p class="eyebrow" id="modal-kicker">ロードンデン</p><h2 id="modal-title"></h2><div id="modal-body"></div></dialog>
<script>"use strict";
(() => {
  // src/core/validation.ts
  function requireThat(ok, message) {
    if (!ok) throw new Error(message);
  }
  function record(x, path2) {
    requireThat(x !== null && typeof x === "object" && !Array.isArray(x), `${path2}: \u30AA\u30D6\u30B8\u30A7\u30AF\u30C8\u304C\u5FC5\u8981\u3067\u3059`);
  }
  function array(x, path2) {
    requireThat(Array.isArray(x), `${path2}: \u914D\u5217\u304C\u5FC5\u8981\u3067\u3059`);
  }
  function str(x, path2) {
    requireThat(typeof x === "string" && x.length > 0 && !["__proto__", "constructor", "prototype"].includes(x), `${path2}: \u6587\u5B57\u5217\u304C\u4E0D\u6B63\u3067\u3059`);
  }
  function int(x, path2, min = 0) {
    requireThat(Number.isSafeInteger(x) && x >= min, `${path2}: ${min}\u4EE5\u4E0A\u306E\u6574\u6570\u304C\u5FC5\u8981\u3067\u3059`);
  }
  function val(x, path2) {
    requireThat(typeof x === "string" || typeof x === "boolean" || typeof x === "number" && Number.isFinite(x), `${path2}: \u5024\u304C\u4E0D\u6B63\u3067\u3059`);
  }
  function stance(x) {
    requireThat(["believe", "deny", "uncertain"].includes(x), "\u8A8D\u8B58\u306E stance \u304C\u4E0D\u6B63\u3067\u3059");
  }
  function strings(x, path2) {
    array(x, path2);
    x.forEach((v) => str(v, path2));
  }
  function unique(xs, label) {
    requireThat(new Set(xs).size === xs.length, `${label}: ID\u304C\u91CD\u8907\u3057\u3066\u3044\u307E\u3059`);
  }
  function ref(id, xs, label) {
    str(id, label);
    requireThat(xs.some((x) => x.id === id), `${label}: \u672A\u5B9A\u7FA9\u306E\u53C2\u7167 ${id}`);
  }
  function bool(x, label) {
    requireThat(typeof x === "boolean", `${label}: \u771F\u507D\u5024\u304C\u5FC5\u8981\u3067\u3059`);
  }
  function sameKeys(x, keys, label) {
    requireThat(Object.keys(x).sort().join("|") === [...keys].sort().join("|"), `${label}: \u30D5\u30A3\u30FC\u30EB\u30C9\u304C\u4E0D\u8DB3\u307E\u305F\u306F\u672A\u77E5\u3067\u3059`);
  }
  function sameCustody(a, b2) {
    return a.kind === b2.kind && (a.kind === "consumed" || b2.kind !== "consumed" && a.id === b2.id);
  }
  function custody(x, c2) {
    record(x, "custody");
    switch (x.kind) {
      case "actor":
        ref(x.id, c2.actors, "custody.actor");
        break;
      case "place":
        ref(x.id, c2.places, "custody.place");
        break;
      case "object":
        ref(x.id, c2.objects, "custody.object");
        break;
      case "consumed":
        break;
      default:
        throw new Error(`custody: \u672A\u77E5\u306E\u7A2E\u5225 ${String(x.kind)}`);
    }
    sameKeys(x, x.kind === "consumed" ? ["kind"] : ["kind", "id"], "custody");
  }
  function guard(x, c2, choice = false, depth = 0) {
    requireThat(depth < 32, "\u6761\u4EF6\u306E\u5165\u308C\u5B50\u304C\u6DF1\u3059\u304E\u307E\u3059");
    record(x, "condition");
    const actor2 = (id) => ref(id, c2.actors, "condition.actor");
    switch (x.op) {
      case "always":
        return;
      case "all":
      case "any":
        array(x.conditions, "conditions");
        x.conditions.forEach((y) => guard(y, c2, choice, depth + 1));
        return;
      case "not":
        guard(x.condition, c2, choice, depth + 1);
        return;
      case "belief":
        ref(x.propositionId, c2.propositions, "condition.proposition");
        stance(x.stance);
        if (!choice) actor2(x.actorId);
        return;
      case "here":
        requireThat(choice, "here\u306F\u5224\u65AD\u5C02\u7528\u3067\u3059");
        ref(x.locationId, c2.places, "condition.place");
        return;
      case "accepted":
        requireThat(choice, "accepted\u306F\u5224\u65AD\u5C02\u7528\u3067\u3059");
        ref(x.agreementId, c2.agreements, "condition.agreement");
        int(x.version, "version", 1);
        return;
      case "offered":
        ref(x.agreementId, c2.agreements, "condition.agreement");
        int(x.version, "version", 1);
        if (!choice) actor2(x.actorId);
        return;
    }
    requireThat(!choice, `\u5224\u65AD\u898F\u5247\u304B\u3089\u4E16\u754C\u72B6\u614B\u306F\u8AAD\u3081\u307E\u305B\u3093: ${String(x.op)}`);
    switch (x.op) {
      case "fact":
        ref(x.propositionId, c2.propositions, "condition.proposition");
        val(x.value, "condition.value");
        break;
      case "at":
        actor2(x.actorId);
        ref(x.locationId, c2.places, "condition.place");
        break;
      case "together":
        strings(x.actorIds, "together.actors");
        requireThat(x.actorIds.length > 0, "\u540C\u5E2D\u8005\u304C\u5FC5\u8981\u3067\u3059");
        x.actorIds.forEach(actor2);
        break;
      case "custody":
        ref(x.objectId, c2.objects, "condition.object");
        custody(x.custody, c2);
        break;
      case "quantity":
        ref(x.objectId, c2.objects, "condition.object");
        int(x.minimum, "minimum");
        break;
      case "agreement":
        ref(x.agreementId, c2.agreements, "condition.agreement");
        int(x.version, "version", 1);
        strings(x.actorIds, "actorIds");
        x.actorIds.forEach(actor2);
        break;
      case "loan":
        ref(x.loanId, c2.loans ?? [], "condition.loan");
        requireThat(["available", "borrowed", "returned"].includes(x.status), "\u8CB8\u501F\u72B6\u614B\u304C\u4E0D\u6B63\u3067\u3059");
        break;
      case "during":
        int(x.from, "from");
        int(x.until, "until", 1);
        requireThat(x.until > x.from, "\u6642\u9593\u533A\u9593\u304C\u9006\u8EE2\u3057\u3066\u3044\u307E\u3059");
        break;
      case "event":
        str(x.type, "event.type");
        actor2(x.actorId);
        break;
      case "active":
        ref(x.actionId, c2.actions, "condition.action");
        break;
      case "reserved":
        str(x.resourceId, "resourceId");
        requireThat(allResources(c2).includes(x.resourceId), "\u672A\u5B9A\u7FA9\u306E\u4E88\u7D04\u8CC7\u6E90");
        break;
      default:
        throw new Error(`\u672A\u77E5\u306E\u6761\u4EF6\u6F14\u7B97\u5B50: ${String(x.op)}`);
    }
  }
  function effect(x, c2) {
    record(x, "effect");
    switch (x.op) {
      case "move":
        ref(x.actorId, c2.actors, "effect.actor");
        ref(x.to, c2.places, "effect.place");
        break;
      case "transfer":
        ref(x.objectId, c2.objects, "effect.object");
        custody(x.from, c2);
        custody(x.to, c2);
        requireThat(x.to.kind !== "consumed", "\u6D88\u8CBB\u306B\u306Fconsume\u3092\u4F7F\u3063\u3066\u304F\u3060\u3055\u3044");
        break;
      case "consume": {
        ref(x.objectId, c2.objects, "effect.object");
        int(x.quantity, "quantity", 1);
        str(x.unit, "unit");
        const o = c2.objects.find((o2) => o2.id === x.objectId);
        requireThat(o.consumable && o.unit === x.unit, "\u6D88\u8CBB\u3067\u304D\u306A\u3044\u7269\u307E\u305F\u306F\u5358\u4F4D\u306E\u4E0D\u4E00\u81F4");
        break;
      }
      case "fact":
        ref(x.propositionId, c2.propositions, "effect.proposition");
        val(x.value, "effect.value");
        requireThat(!c2.propositions.find((p2) => p2.id === x.propositionId).derived, "\u89B3\u6E2C\u7528\u306E\u5C0E\u51FA\u547D\u984C\u306F\u76F4\u63A5\u66F8\u304D\u63DB\u3048\u3089\u308C\u307E\u305B\u3093");
        break;
      case "emit":
        strings(x.actorIds, "event.actorIds");
        x.actorIds.forEach((id) => ref(id, c2.actors, "event.actor"));
        strings(x.subjectIds, "event.subjectIds");
        str(x.type, "event.type");
        requireThat(!x.type.startsWith("engine."), "engine.*\u306F\u4E88\u7D04\u3055\u308C\u305F\u51FA\u6765\u4E8B\u540D\u3067\u3059");
        ref(x.locationId, c2.places, "event.place");
        break;
      case "service":
        str(x.serviceId, "serviceId");
        requireThat(c2.services.includes(x.serviceId), "\u672A\u5B9A\u7FA9\u306E\u30B5\u30FC\u30D3\u30B9");
        bool(x.active, "active");
        break;
      case "inform":
        ref(x.speakerId, c2.actors, "speaker");
        ref(x.recipientId, c2.actors, "recipient");
        ref(x.propositionId, c2.propositions, "proposition");
        break;
      case "observe":
        strings(x.actorIds, "observers");
        x.actorIds.forEach((id) => ref(id, c2.actors, "observer"));
        ref(x.propositionId, c2.propositions, "proposition");
        ref(x.locationId, c2.places, "observation.place");
        str(x.sourceId, "source");
        break;
      case "offer":
        ref(x.speakerId, c2.actors, "speaker");
        ref(x.recipientId, c2.actors, "recipient");
        ref(x.agreementId, c2.agreements, "agreement");
        break;
      case "accept":
        ref(x.actorId, c2.actors, "actor");
        ref(x.agreementId, c2.agreements, "agreement");
        int(x.version, "version", 1);
        break;
      case "loan":
        ref(x.loanId, c2.loans ?? [], "loan");
        requireThat(["borrowed", "returned"].includes(x.status), "\u8CB8\u501F\u306E\u52B9\u679C\u304C\u4E0D\u6B63\u3067\u3059");
        break;
      default:
        throw new Error(`\u672A\u77E5\u306E\u52B9\u679C: ${String(x.op)}`);
    }
  }
  function effectResources(e) {
    switch (e.op) {
      case "move":
        return [`actor:${e.actorId}`];
      case "transfer":
        return [`object:${e.objectId}`, ...[e.from, e.to].filter((x) => x.kind === "actor").map((x) => `actor:${x.id}`)];
      case "consume":
        return [`object:${e.objectId}`];
      case "fact":
        return [`fact:${e.propositionId}`];
      case "service":
        return [`service:${e.serviceId}`];
      case "emit":
        return [];

    const key = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d", " "].includes(key)) e.preventDefault();
    if (key === "escape") {
      paused = !paused;
      syncPause();
    }
    if (key === "m") mapMenu();
    if (key === "i") inventory();
    if (key === "j") notebook();
    if (key === "e" || key === "enter") {
      const person2 = dinnerContent.actors.find((a) => a.id !== P && state.actors[a.id].locationId === state.actors[P].locationId && !moving(a.id));
      if (person2) talk2(person2.id);
    }
    const directions = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
    const dir = directions[key];
    if (dir) {
      const p2 = places.get(state.actors[P].locationId);
      const candidates = p2.links.map((id) => places.get(id)).map((q) => ({ q, dot: ((q.x - p2.x) * dir[0] + (q.y - p2.y) * dir[1]) / Math.hypot(q.x - p2.x, q.y - p2.y) })).sort((a, b2) => b2.dot - a.dot);
      if (candidates[0].dot > 0.2) walk(candidates[0].q.id);
    }
  });
  document.addEventListener("visibilitychange", syncPause);
  function frame(now) {
    const delta = Math.max(0, Math.min(100, now - lastFrame));
    lastFrame = now;
    try {
      clock.advance(delta * (fast ? 4 : 1), tick);
    } catch (error) {
      paused = true;
      syncPause();
      toast(`\u8857\u3092\u4E00\u6642\u505C\u6B62\u3057\u307E\u3057\u305F\uFF1A${error instanceof Error ? error.message : String(error)}`, true);
    }
    renderer.draw(state, path, paused || modal.open || document.hidden ? 0 : Math.min(1, (now - lastTickTime) / 100));
    requestAnimationFrame(frame);
  }
  renderer.load().then(() => {
    renderUI();
    help(true);
    requestAnimationFrame(frame);
  }).catch((error) => toast(`\u7D20\u6750\u3092\u8AAD\u307F\u8FBC\u3081\u307E\u305B\u3093\u3067\u3057\u305F\uFF1A${String(error)}`, true));
})();
</script>
</body></html>
